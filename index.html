const scene=new THREE.Scene();scene.background=new THREE.Color(0x070c19);scene.fog=new THREE.Fog(0x070c19,22,45);const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(14,17,20);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('scene').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=9;controls.maxDistance=36;controls.maxPolarAngle=Math.PI/2.15;controls.minPolarAngle=.45;controls.update();scene.add(new THREE.HemisphereLight(0x9bc9ff,0x10101e,2));const light=new THREE.DirectionalLight(0xffffff,2.3);light.position.set(6,12,8);scene.add(light);

const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),clickables=[],rings=[],chars=[];const deskMat=mat(0x22314a),screenMat=mat(0x081423);people.forEach((p,i)=>{const col=i%3,row=Math.floor(i/3),x=(col-1)*5.5,z=(row-1)*4.5;const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);const color=p[2];const ring=new THREE.Mesh(new THREE.TorusGeometry(1.15,.045,8,48),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8}));ring.rotation.x=-Math.PI/2;ring.position.y=.025;group.add(ring);rings.push(ring);const desk=box(2.45,.15,.85,deskMat,0,.9,-.72,group);box(.15,.75,.15,deskMat,-1,.48,-.72,group);box(.15,.75,.15,deskMat,1,.48,-.72,group);const monitor=box(1.15,.76,.07,screenMat,0,1.47,-.94,group);box(.95,.52,.012,mat(color,.38),0,1.48,-.897,group);box(.09,.35,.08,mat(0x3a4e68),0,1.04,-.92,group);box(.68,.035,.25,mat(0x34465e),0,1.01,-.45,group);const body=cyl(.38,.44,.85,mat(0x263a55),0,.83,.55,group);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,20,14),mat(0xc2d7e6));head.position.set(0,1.55,.55);group.add(head);const visor=box(.48,.12,.13,mat(color,.3),0,1.6,.82,group);const chair=cyl(.47,.42,.13,mat(0x18273d),0,.42,.85,group);const hit=box(2.8,2.4,2.7,new THREE.MeshBasicMaterial({visible:false}),0,1,0,group);hit.userData.index=i;clickables.push(hit);chars.push({head,body});});

<script>
(() => {
  const names = [
    "AI Director", "Media Analyst", "Trend Scout",
    "Story Director", "Video Editor", "Subtitle Artist",
    "Sound Designer", "Color Artist", "Quality Manager"
  ];
  const key = "ai-creator-studio-tasks-v1";
  let tasks = [];
  try {
    const saved = JSON.parse(localStorage.getItem(key) || "[]");
    if (Array.isArray(saved)) tasks = saved;
  } catch (e) {
    console.warn("Aufgaben konnten nicht geladen werden", e);
  }

  const section = document.createElement("section");
  section.style.cssText = "position:fixed;right:12px;top:145px;z-index:4;background:#101d32;color:#eaf4ff;border:1px solid #347d81;border-radius:14px;padding:12px;width:min(320px,calc(100vw - 24px));max-height:48vh;overflow:auto;font:13px system-ui;box-shadow:0 12px 35px #0009;display:none";
  section.innerHTML = `
    <button id="task-close" style="float:right">×</button>
    <h3>Aufgabenverwaltung · Phase 1.1</h3>
    <select id="task-agent"></select>
    <input id="task-title" placeholder="Neue Aufgabe" maxlength="150">
    <button id="task-add">Hinzufügen</button>
    <div id="task-list"></div>
  `;
  document.body.appendChild(section);

  const toggle = document.createElement("button");
  toggle.textContent = "Aufgaben";
  toggle.style.cssText = "position:fixed;top:110px;right:12px;z-index:4;background:#183b4c;color:#7ef1e1;border:1px solid #347d81;border-radius:20px;padding:9px 14px";
  document.body.appendChild(toggle);

  const agent = section.querySelector("#task-agent");
  names.forEach((name, i) => {
    agent.add(new Option(name, String(i)));
  });

  const input = section.querySelector("#task-title");
  const list = section.querySelector("#task-list");
  const save = () => {
    try {
      localStorage.setItem(key, JSON.stringify(tasks));
    } catch (e) {
      alert("Lokales Speichern nicht möglich.");
    }
  };
  function render() {
    list.replaceChildren();
    tasks.forEach((task, i) => {
      const row = document.createElement("div");
      row.style.cssText = "padding:9px 0;border-bottom:1px solid #30445b";
      const title = document.createElement("div");
      title.textContent = names[task.agent] + ": " + task.title;
      const status = document.createElement("select");
      ["Offen", "In Arbeit", "Erledigt"].forEach(value => {
        status.add(new Option(value, value));
      });
      status.value = task.status;
      status.onchange = () => {
        task.status = status.value;
        save();
      };
      const remove = document.createElement("button");
      remove.textContent = "Löschen";
      remove.onclick = () => {
        tasks.splice(i, 1);
        save();
        render();
      };
      row.append(title, status, remove);
      list.appendChild(row);
    });
  }
  toggle.onclick = () => {
    section.style.display =
      section.style.display === "none" ? "block" : "none";
  };
  section.querySelector("#task-close").onclick = () => {
    section.style.display = "none";
  };
  section.querySelector("#task-add").onclick = () => {
    const title = input.value.trim();
    if (!title) return;
    tasks.push({
      agent: Number(agent.value),
      title,
      status: "Offen"
    });
    input.value = "";
    save();
    render();
  };
  render();
})();
</script>
  
<script>
(() => {
  const key = "ai-creator-studio-tasks-v1";
  const names = [
    "AI Director", "Media Analyst", "Trend Scout",
    "Story Director", "Video Editor", "Subtitle Artist",
    "Sound Designer", "Color Artist", "Quality Manager"
  ];

  function showTasks() {
    const panel = document.getElementById("panel");
    const detail = document.getElementById("detail");
    if (!panel || !detail) return;

    const heading = detail.querySelector("h2");
    if (!heading) return;

    const index = names.indexOf(heading.textContent.trim());
    if (index < 0) return;

    let tasks = [];
    try {
      const saved = JSON.parse(localStorage.getItem(key) || "[]");
      if (Array.isArray(saved)) tasks = saved;
    } catch (e) {
      console.warn("Aufgaben nicht lesbar", e);
    }

    const mine = tasks.filter(t => Number(t.agent) === index);
    const done = mine.filter(t => t.status === "Erledigt").length;
    const active = mine.filter(t => t.status === "In Arbeit").length;
    const percent = mine.length ? Math.round(done / mine.length * 100) : 0;

    const old = detail.querySelector("#employee-tasks");
    if (old) old.remove();

    const box = document.createElement("div");
    box.id = "employee-tasks";
    box.style.cssText = "border-top:1px solid #347d81;margin-top:12px;padding-top:12px;font-size:13px;color:#eaf4ff";

    const title = document.createElement("h3");
    title.textContent = "Aufgabenübersicht · Phase 1.2";
    box.appendChild(title);

    const summary = document.createElement("p");
    summary.textContent = `${mine.length} Aufgaben · ${active} in Arbeit · ${done} erledigt`;
    box.appendChild(summary);

    const bar = document.createElement("div");
    bar.style.cssText = "height:9px;background:#253e5a;border-radius:10px;overflow:hidden";
    const fill = document.createElement("div");
    fill.style.cssText = `height:100%;width:${percent}%;background:#4de5df`;
    bar.appendChild(fill);
    box.appendChild(bar);

    const progress = document.createElement("p");
    progress.textContent = `Fortschritt: ${percent}%`;
    box.appendChild(progress);

    mine.forEach(task => {
      const row = document.createElement("p");
      row.textContent = `${task.status === "Erledigt" ? "✓" : "•"} ${task.title} — ${task.status}`;
      box.appendChild(row);
    });

    if (!mine.length) {
      const empty = document.createElement("p");
      empty.textContent = "Noch keine Aufgaben zugewiesen.";
      box.appendChild(empty);
    }

    detail.appendChild(box);
  }

  const panel = document.getElementById("panel");
  if (!panel) return;

  new MutationObserver(() => {
    if (panel.classList.contains("open")) showTasks();
  }).observe(panel, { attributes: true, attributeFilter: ["class"] });

  const chips = document.getElementById("agents");
  if (chips) {
    chips.addEventListener("click", () => {
      setTimeout(showTasks, 0);
    });
  }
})();
</script>
